version: "3.9"

services:
  api:
    build:
      context: ./image-cluster-ai-api
    container_name: api
    ports:
      - "${API_HOST_PORT}:8000"
    environment:
      - PORT=8000
    restart: unless-stopped

  web:
    build:
      context: ./image-cluster-ai-web
      args:
        API_URL: ${API_URL}
    container_name: web
    ports:
      - "${WEB_HOST_PORT}:80"
    depends_on:
      - api
    restart: unless-stopped
